  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظافة الصف</title>
<style>
  :root{
    --purple:#6c5ce7;
    --purple-glow:#d9d3f8;
    --green:#4caf50;
    --red:#ff7675;
    --ink:#3a3a5c;
    --muted:#888;
    --prompt-ink:#5b4b8a;
    --dot-off:#e0dcf2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#fef6e4 0%,#e8f4fd 100%);
    font-family:'Tahoma','Segoe UI',sans-serif;
    color:var(--ink);
    direction:rtl;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 14px 20px;
  }

  .sound-toggle{
    position:fixed;
    top:14px;
    left:14px;
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    font-size:17px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sound-toggle:active{transform:scale(.94);}

  .wrap{width:100%; max-width:500px; display:flex; flex-direction:column; align-items:center;}

  .header{text-align:center; margin-bottom:4px;}
  .title{font-size:20px; font-weight:800; color:var(--ink); margin:0;}
  .subtitle{font-size:13px; color:var(--muted); font-weight:600; margin:2px 0 0;}

  /* ---- back button row ---- */
  .back-row{
    width:100%;
    display:flex;
    justify-content:flex-start;
    margin-top:10px;
  }
  .back-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:none;
    border-radius:20px;
    padding:7px 16px;
    font-size:13px;
    font-weight:700;
    color:var(--purple);
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    font-family:inherit;
  }
  .back-btn:active{transform:scale(.96);}

  /* ---- level select screen ---- */
  .levels-screen{
    width:100%;
    max-width:500px;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:14px;
  }
  .level-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border-radius:18px;
    padding:14px 16px;
    box-shadow:0 5px 16px rgba(0,0,0,.1);
    cursor:pointer;
    border:5px solid transparent;
    transition:transform .12s ease, border-color .12s ease;
  }
  .level-card:active{transform:scale(.98);}
  .level-card .icon{
    flex:0 0 auto;
    width:46px;height:46px;
    border-radius:50%;
    background:var(--purple-glow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
  }
  .level-card .info{flex:1 1 auto; text-align:right;}
  .level-card .info .lvl-name{font-size:16px; font-weight:800; color:var(--ink); margin:0;}
  .level-card .info .lvl-desc{font-size:12px; color:var(--muted); font-weight:600; margin:2px 0 0;}
  .level-card .arrow{flex:0 0 auto; color:var(--purple); font-size:18px;}

  .prompt-row{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    margin-top:14px;
  }
  .speak-btn{
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:var(--purple);
    color:#fff;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
  }
  .speak-btn:active{transform:scale(.94);}
  .speak-btn.speaking{animation:pulse .6s infinite alternate;}
  @keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.15); box-shadow:0 0 0 6px var(--purple-glow);}
  }

  .prompt-box{
    flex:1 1 auto;
    background:#fff;
    border-radius:16px;
    padding:10px 18px;
    font-size:16px;
    font-weight:700;
    color:var(--prompt-ink);
    text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
  }

  .progress{
    display:none;
    gap:8px;
    margin:12px 0 6px;
  }
  .progress.show{display:flex;}
  .dot{
    width:12px;height:12px;
    border-radius:50%;
    background:var(--dot-off);
    transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .dot.done{background:var(--green); transform:scale(1.15);}
  .dot.current{background:var(--purple); transform:scale(1.3); box-shadow:0 0 0 3px var(--purple-glow);}

  .cards{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:500px;
    margin-top:6px;
  }
  .card{
    position:relative;
    width:100%;
    border-radius:18px;
    border:5px solid transparent;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    overflow:hidden;
    cursor:pointer;
    background:#fff;
    transition:border-color .15s ease;
  }
  .card.disabled{cursor:default; pointer-events:none;}
  .card.correct{border-color:var(--green);}
  .card.wrong-flash{border-color:var(--red);}
  .card img{
    display:block;
    width:100%;
    aspect-ratio:3/2;
    object-fit:cover;
    -webkit-user-drag:none;
    user-select:none;
  }
  .cards.lvl-2 .card img{
    aspect-ratio:16/9;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  .card.shake{animation:shake .4s;}

  .mark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:72px;
    pointer-events:none;
    background:rgba(255,255,255,.25);
  }
  .mark.hidden{display:none;}

  .start-screen{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
    padding:36px 24px;
    margin-top:18px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .start-screen .emoji{font-size:52px;}
  .start-screen p{margin:0; color:var(--muted); font-size:13px; font-weight:600; max-width:320px;}

  .summary{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
    padding:32px 24px;
    margin-top:18px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .summary .emoji{font-size:52px;}
  .summary h2{font-size:18px; margin:0; color:var(--ink);}
  .summary-buttons{display:flex; gap:10px; margin-top:8px;}

  .restart-btn,.levels-btn,.start-btn{
    padding:11px 24px;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:28px;
    color:#fff;
    cursor:pointer;
    box-shadow:0 5px 14px rgba(0,0,0,.2);
    font-family:inherit;
  }
  .restart-btn{background:var(--green);}
  .levels-btn,.start-btn{background:var(--purple);}
  .restart-btn:active,.levels-btn:active,.start-btn:active{transform:scale(.96);}

  [hidden]{display:none!important;}
</style>
</head>
<body>
<button class="sound-toggle" id="soundToggle" title="كتم/تشغيل الصوت">🔊</button>

<div class="wrap">

  <div class="header">
    <p class="title">المحافظة على نظافة الصف</p>
    <p class="subtitle" id="subtitle">اضغطي ابدأ لتشغيل النشاط</p>
  </div>

  <section class="start-screen" id="startScreen">
    <div class="emoji">🧹✨</div>
    <p>تأكد من رفع صوت الجهاز لسماع الأسئلة والتعليقات الصوتية بوضوح.</p>
    <button class="start-btn" id="startBtn">ابدأ النشاط 🔊</button>
  </section>

  <div class="levels-screen" id="levelsScreen" hidden>
    <div class="level-card" data-level="0">
      <div class="icon">1️⃣</div>
      <div class="info">
        <p class="lvl-name">المستوى الأول</p>
        <p class="lvl-desc">خيارين — أسهل</p>
      </div>
      <div class="arrow">‹</div>
    </div>
    <div class="level-card" data-level="1">
      <div class="icon">2️⃣</div>
      <div class="info">
        <p class="lvl-name">المستوى الثاني</p>
        <p class="lvl-desc">ثلاثة خيارات — أصعب</p>
      </div>
      <div class="arrow">‹</div>
    </div>
  </div>

  <div class="back-row" id="backRow" hidden>
    <button class="back-btn" id="backBtn">‹ المستويات</button>
  </div>

  <div class="prompt-row" id="promptRow" hidden>
    <button class="speak-btn" id="speakBtn">🔊</button>
    <div class="prompt-box" id="promptText">ما هو السلوك الصحيح للمحافظة على نظافة الصف؟</div>
  </div>

  <div class="progress" id="progress"></div>

  <div class="cards" id="cards" hidden></div>

  <section class="summary" id="summary" hidden>
    <div class="emoji">🏆🎉</div>
    <h2 id="summaryTitle">أحسنت! أكملت المستوى بنجاح</h2>
    <div class="summary-buttons">
      <button class="restart-btn" id="restartBtn">إعادة المستوى</button>
      <button class="levels-btn" id="levelsBtn">المستويات</button>
    </div>
  </section>

</div>

  };

  var QUESTION_TEXT = "ما هو السلوك الصحيح للمحافظة على نظافة الصف؟";
  var LEVEL_LABELS = ["المستوى الأول", "المستوى الثاني"];

  var TRANSITION_DELAY = 1200;     // نفس المدة الزمنية بين كل التكرارات، ثابتة دومًا
  var WRONG_MARK_DURATION = 2000;  // إزالة علامة ❌ بعد ثانيتين بالضبط
  var TRIALS_PER_LEVEL = 5;

  var LEVELS = [
    { images: ["good", "bad1"] },
    { images: ["good", "bad2", "bad3"] }
  ];

  var levelIndex = 0;
  var trialIndex = 0;
  var locked = false;
  var muted = false;
  var session = 0;   // يزداد عند كل تنقل بين الشاشات لإلغاء أي مؤقتات/أصوات معلّقة من شاشة سابقة

  var startScreen = document.getElementById('startScreen');
  var startBtn = document.getElementById('startBtn');
  var levelsScreen = document.getElementById('levelsScreen');
  var backRow = document.getElementById('backRow');
  var backBtn = document.getElementById('backBtn');
  var subtitle = document.getElementById('subtitle');
  var promptRow = document.getElementById('promptRow');
  var promptText = document.getElementById('promptText');
  var speakBtn = document.getElementById('speakBtn');
  var progressWrap = document.getElementById('progress');
  var cardsWrap = document.getElementById('cards');
  var summary = document.getElementById('summary');
  var summaryTitle = document.getElementById('summaryTitle');
  var restartBtn = document.getElementById('restartBtn');
  var levelsBtn = document.getElementById('levelsBtn');
  var soundToggle = document.getElementById('soundToggle');

  var audioQuestion = document.getElementById('audioQuestion');
  var audioCorrect = document.getElementById('audioCorrect');
  var audioWrong = document.getElementById('audioWrong');
  [audioQuestion, audioCorrect, audioWrong].forEach(function(a){ a.volume = 1.0; });

  promptText.textContent = QUESTION_TEXT;

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function playAudio(audioEl){
    return new Promise(function(resolve){
      if (muted){ resolve(); return; }
      try{
        audioEl.currentTime = 0;
        audioEl.volume = 1.0;
        var onEnd = function(){
          audioEl.removeEventListener('ended', onEnd);
          resolve();
        };
        audioEl.addEventListener('ended', onEnd);
        var p = audioEl.play();
        if (p && p.catch) { p.catch(function(){ resolve(); }); }
      }catch(e){ resolve(); }
    });
  }

  function wait(ms){
    return new Promise(function(resolve){ setTimeout(resolve, ms); });
  }

  function stopAllAudio(){
    [audioQuestion, audioCorrect, audioWrong].forEach(function(a){
      try{ a.pause(); a.currentTime = 0; }catch(e){}
    });
  }

  function renderProgress(){
    progressWrap.innerHTML = '';
    progressWrap.classList.add('show');
    for (var i = 0; i < TRIALS_PER_LEVEL; i++){
      var d = document.createElement('div');
      d.className = 'dot' + (i < trialIndex ? ' done' : (i === trialIndex ? ' current' : ''));
      progressWrap.appendChild(d);
    }
  }

  function playQuestion(mySession){
    speakBtn.classList.add('speaking');
    locked = true;
    return playAudio(audioQuestion).then(function(){
      if (session !== mySession) return;
      speakBtn.classList.remove('speaking');
      locked = false;
    });
  }

  function buildTrial(){
    var mySession = session;
    locked = true;
    cardsWrap.innerHTML = '';
    cardsWrap.hidden = false;
    cardsWrap.classList.toggle('lvl-2', levelIndex === 1);

    var level = LEVELS[levelIndex];
    var order = shuffle(level.images);

    order.forEach(function(key){
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.key = key;

      var img = document.createElement('img');
      img.src = IMG[key];
      img.alt = 'صورة سلوك';
      img.draggable = false;
      card.appendChild(img);

      var mark = document.createElement('div');
      mark.className = 'mark hidden';
      card.appendChild(mark);

      card.addEventListener('click', function(){ onCardClick(card, key, mark, mySession); });
      cardsWrap.appendChild(card);
    });

    subtitle.textContent = LEVEL_LABELS[levelIndex] + ' — التكرار ' + (trialIndex + 1) + ' من ' + TRIALS_PER_LEVEL;
    renderProgress();
    playQuestion(mySession);
  }

  function setCardsDisabled(disabled){
    var cards = cardsWrap.querySelectorAll('.card');
    cards.forEach(function(c){
      if (disabled) c.classList.add('disabled');
      else c.classList.remove('disabled');
    });
  }

  function onCardClick(card, key, mark, mySession){
    if (session !== mySession) return;
    if (locked) return;
    if (card.classList.contains('disabled')) return;

    var isCorrect = (key === 'good');

    if (isCorrect){
      locked = true;
      setCardsDisabled(true);
      card.classList.add('correct');
      mark.classList.remove('hidden');
      mark.textContent = '✔️';

      playAudio(audioCorrect).then(function(){
        return wait(TRANSITION_DELAY);
      }).then(function(){
        if (session !== mySession) return;
        advance();
      });
    } else {
      locked = true;
      card.classList.add('wrong-flash', 'shake');
      mark.classList.remove('hidden');
      mark.textContent = '❌';
      setTimeout(function(){ card.classList.remove('shake'); }, 400);

      playAudio(audioWrong).then(function(){
        return wait(WRONG_MARK_DURATION);
      }).then(function(){
        if (session !== mySession) return;
        mark.classList.add('hidden');
        card.classList.remove('wrong-flash');
        locked = false;
      });
    }
  }

  function advance(){
    trialIndex++;
    if (trialIndex >= TRIALS_PER_LEVEL){
      showLevelSummary();
      return;
    }
    buildTrial();
  }

  function showLevelSummary(){
    session++;
    stopAllAudio();
    promptRow.hidden = true;
    backRow.hidden = true;
    progressWrap.classList.remove('show');
    cardsWrap.hidden = true;
    subtitle.textContent = 'أحسنت!';
    summaryTitle.textContent = 'أحسنت! أكملت ' + LEVEL_LABELS[levelIndex] + ' بنجاح';
    summary.hidden = false;
  }

  function showStart(){
    session++;
    stopAllAudio();
    startScreen.hidden = false;
    levelsScreen.hidden = true;
    backRow.hidden = true;
    promptRow.hidden = true;
    progressWrap.classList.remove('show');
    cardsWrap.hidden = true;
    summary.hidden = true;
    subtitle.textContent = 'اضغطي ابدأ لتشغيل النشاط';
  }

  function showLevelSelect(){
    session++;
    stopAllAudio();
    startScreen.hidden = true;
    summary.hidden = true;
    backRow.hidden = true;
    promptRow.hidden = true;
    progressWrap.classList.remove('show');
    cardsWrap.hidden = true;
    levelsScreen.hidden = false;
    subtitle.textContent = 'اختاري المستوى';
  }

  function selectLevel(idx){
    session++;
    var mySession = session;
    stopAllAudio();
    levelsScreen.hidden = true;
    summary.hidden = true;
    backRow.hidden = false;
    levelIndex = idx;
    trialIndex = 0;
    buildTrial();
  }

  startBtn.addEventListener('click', showLevelSelect);
  levelsBtn.addEventListener('click', showLevelSelect);
  backBtn.addEventListener('click', showLevelSelect);
  restartBtn.addEventListener('click', function(){ selectLevel(levelIndex); });

  levelsScreen.querySelectorAll('.level-card').forEach(function(cardEl){
    cardEl.addEventListener('click', function(){
      var idx = parseInt(cardEl.getAttribute('data-level'), 10);
      selectLevel(idx);
    });
  });

  speakBtn.addEventListener('click', function(){
    if (locked && speakBtn.classList.contains('speaking')) return;
    playQuestion(session);
  });

  soundToggle.addEventListener('click', function(){
    muted = !muted;
    soundToggle.textContent = muted ? '🔇' : '🔊';
    [audioQuestion, audioCorrect, audioWrong].forEach(function(a){ a.muted = muted; });
  });

})();
</script>
